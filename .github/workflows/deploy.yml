name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall dioxus-cli@0.7.10 --no-confirm

      - name: Build
        run: dx build --release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/thinkctl/release/web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Bind thinkctl.dev
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              cname: 'thinkctl.dev',
              build_type: 'workflow'
            }
            try {
              const current = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              }).catch((err) => {
                core.warning(`getPages status=${err.status} ${JSON.stringify(err.response && err.response.data)}`)
                return null
              })
              if (current && current.data) {
                core.info(`pages before ${JSON.stringify(current.data)}`)
              }
              const res = await github.rest.repos.updateInformationAboutPagesSite(params)
              core.info(`pages after ${JSON.stringify(res.data)}`)
            } catch (err) {
              const body = err.response ? JSON.stringify(err.response.data) : String(err)
              core.error(`pages bind failed status=${err.status} ${body}`)
              throw err
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
